[project]
name = "school_india"
authors = [
    { name = "School OS Team", email = "engineering@school-os.in" }
]
description = "Indian School ERP Extensions: Academics, CBSE/ICSE Exams, Govt Data (PEN/APAAR/UDISE+), Fee Policies & Certificates"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
education = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"
payments = ">=16.0.0,<17.0.0"
